name: SteamFilter engineering checks
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dsp-tests:
    name: DSP stress (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure standalone DSP
        run: cmake -S . -B build/dsp -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DSTEAMFILTER_BUILD_PLUGIN=OFF
      - name: Build tests
        run: cmake --build build/dsp --config Release --parallel
      - name: Run tests
        run: ctest --test-dir build/dsp -C Release --output-on-failure
  vst3-compile:
    name: VST3 compiler check (Windows)
    needs: dsp-tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure JUCE 9.0.4
        run: cmake -S . -B build/win -G "Visual Studio 17 2022" -A x64 -DSTEAMFILTER_BUILD_PLUGIN=ON -DBUILD_TESTING=ON
      - name: Compile VST3 (no release and no deployment)
        run: cmake --build build/win --config Release --target SteamFilter_VST3 --parallel 4
      - name: Build editor lifecycle regression test
        run: cmake --build build/win --config Release --target SteamFilterLifecycleSmoke --parallel 4
      - name: Run DSP and editor create/remove regression tests with MSVC
        run: |
          cmake --build build/win --config Release --target SteamDSPStress SteamDSPModules --parallel 4
          ctest --test-dir build/win -C Release --output-on-failure
      - name: Upload rendered JUCE UI preview
        uses: actions/upload-artifact@v4
        with:
          name: SteamFilter-UI-REAL-RENDER
          path: build/win/SteamFilter-UI-PREVIEW.png
          if-no-files-found: error
          retention-days: 30
      - name: Ensure an actual plugin bundle was produced
        shell: pwsh
        run: |
          $bundles = Get-ChildItem -Path build/win -Filter "SteamFilter.vst3" -Recurse
          if ($bundles.Count -eq 0) { throw "VST3 bundle not produced" }
      - name: Stage compiled Windows VST3 test bundle
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -Path build/win -Filter "SteamFilter.vst3" -Directory -Recurse |
            Where-Object { $_.FullName -match "SteamFilter_artefacts" } |
            Select-Object -First 1
          if ($null -eq $bundle) { throw "VST3 bundle directory not found" }
          New-Item -ItemType Directory -Path "staging" -Force | Out-Null
          Copy-Item -LiteralPath $bundle.FullName -Destination "staging/SteamFilter.vst3" -Recurse -Force
          if (-not (Test-Path "staging/SteamFilter.vst3/Contents")) {
            throw "Incomplete VST3 bundle: missing Contents directory"
          }
      - name: Upload Windows VST3 test bundle (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: SteamFilter-Windows-VST3-TEST
          path: staging/
          if-no-files-found: error
          retention-days: 30
      # Actions test artifact remains available as an engineering trace.
      # Cubase/pluginval and real-vocal listening validation still required.

  preview-release:
    name: Publish unsigned preview with SHA-256 checksum
    needs: vst3-compile
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Publish verified Windows preview') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release documentation
        uses: actions/checkout@v4
      - name: Download compiled VST3 from successful Windows validation
        uses: actions/download-artifact@v4
        with:
          name: SteamFilter-Windows-VST3-TEST
          path: dist/
      - name: Verify VST3 bundle and prepare checksummed ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -d dist/SteamFilter.vst3/Contents
          module="$(find dist/SteamFilter.vst3/Contents -type f -name 'SteamFilter.vst3' -print -quit)"
          if [ -z "$module" ]; then
            echo 'No actual Windows VST3 binary found inside the bundle' >&2
            exit 1
          fi
          file "$module"
          if ! file "$module" | grep -q 'PE32+'; then
            echo 'Expected a Windows 64-bit PE binary' >&2
            exit 1
          fi
          (cd dist && zip -q -r ../SteamFilter-Win64-PREVIEW.zip SteamFilter.vst3)
          unzip -tqq SteamFilter-Win64-PREVIEW.zip
          sha256sum SteamFilter-Win64-PREVIEW.zip > SHA256SUMS.txt
          echo "### SteamFilter preview: checksummed, UNSIGNED Windows VST3" >> "$GITHUB_STEP_SUMMARY"
          echo 'The successful workflow is a compilation and automated-DSP check, not malware or Cubase certification.' >> "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Publish GitHub prerelease (not production-certified)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v0.2.0-preview.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" SteamFilter-Win64-PREVIEW.zip SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "SteamFilter v0.2.0 preview (UNSIGNED, test only)" \
            --notes-file Documentation/PreviewReleaseNotes.md \
            --prerelease --latest=false
          echo "### GitHub prerelease" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$tag" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
